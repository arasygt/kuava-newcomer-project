<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Target-Lock Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span>TARGET-LOCK TRACKER</div>
    <div id="videoMeta" class="meta"></div>
  </header>

  <div id="error" class="banner error hidden" role="alert"></div>

  <main class="layout">
    <section class="panel stage-panel">
      <!-- Step 1: upload -->
      <div id="uploadView" class="upload">
        <h2>1. Upload a video</h2>
        <p class="hint">MP4 (H.264) only. Large files are processed locally on this machine.</p>
        <label class="drop" id="dropZone">
          <input type="file" id="fileInput" accept="video/mp4,.mp4">
          <span>Drop an .mp4 here or click to choose</span>
        </label>
        <div id="uploadStatus" class="hint"></div>
      </div>

      <!-- Step 2: select target on a still frame -->
      <div id="selectView" class="hidden">
        <div class="stage-head">
          <h2 id="selectTitle">2. Draw a box around the target</h2>
          <div class="controls">
            <label>Tracker
              <select id="trackerSelect"></select>
            </label>
            <button id="startTrackBtn" class="btn primary" disabled>Start tracking</button>
          </div>
        </div>
        <div class="stage"><canvas id="selectCanvas"></canvas></div>
        <div id="selectStatus" class="hint">Click and drag on the frame.</div>
      </div>

      <!-- Step 3: playback with overlay -->
      <div id="playView" class="hidden">
        <div class="stage-head">
          <h2>3. Review tracking</h2>
          <div class="controls">
            <button id="newVideoBtn" class="btn ghost">New video</button>
          </div>
        </div>
        <div class="stage" id="playStage">
          <video id="video" controls muted playsinline></video>
          <canvas id="overlay"></canvas>
        </div>
        <div class="hud-row">
          <span>FRAME <b id="hudFrame">0</b></span>
          <span>TIME <b id="hudTime">0.00 s</b></span>
          <span>STATE <b id="hudState">—</b></span>
        </div>
      </div>
    </section>

    <aside class="panel side">
      <h3>Tracking</h3>
      <div class="stats">
        <div class="stat"><div class="label">Last run</div><div id="statRun" class="value small">—</div></div>
      </div>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
